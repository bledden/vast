<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codec Vision</title>
<style>
  :root { --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3; --muted: #8b949e; --accent: #3fb950; --alert: #ff3b5c; --warn: #ffc800; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 1400px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
  h1 { margin: 0; font-size: 22px; }
  h1 a { color: inherit; text-decoration: none; }
  .sub { color: var(--muted); }
  h2 { margin: 6px 0 0; font-size: 16px; }
  h2 small { color: var(--muted); font-weight: normal; }

  .stage { position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 9; }
  .stage moq-watch, .stage moq-watch canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
  .stage .overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; object-fit: contain; }
  .banner { position: absolute; left: 0; right: 0; top: 0; padding: 8px 12px; background: rgba(255, 59, 92, 0.92); color: #fff;
            font-weight: 600; transform: translateY(-100%); transition: transform 0.25s; z-index: 2; }
  .banner.on { transform: none; animation: pulse 1s ease-in-out 3; }
  @keyframes pulse { 50% { background: rgba(255, 59, 92, 0.6); } }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat { background: var(--panel); border-radius: 8px; padding: 10px 14px; }
  .stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat.win b { color: var(--accent); }

  .tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
  .tab { background: var(--panel); border-radius: 8px; padding: 8px 12px; color: var(--text); text-decoration: none; border: 2px solid transparent; display: grid; gap: 2px; }
  .tab.on { border-color: var(--accent); }
  .tab.alerting { border-color: var(--alert); animation: pulse-border 1s ease-in-out 4; }
  @keyframes pulse-border { 50% { border-color: transparent; } }
  .tab .row { display: flex; justify-content: space-between; gap: 8px; }
  .tab .name { font-weight: 600; }
  .tab .saved { color: var(--accent); font-variant-numeric: tabular-nums; }
  .tab .ai { color: var(--muted); font-size: 12px; }
  .tab .ai.live { color: var(--warn); }
  .ask { display: flex; gap: 8px; }
  .ask input { flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; }
  .ask button { background: var(--accent); color: #000; border: 0; border-radius: 8px; padding: 0 16px; font-weight: 600; cursor: pointer; }
  .answer { background: var(--panel); border-radius: 8px; padding: 10px 14px; border-left: 4px solid var(--accent); display: none; }
  .answer.on { display: block; }

  .events { display: grid; gap: 8px; }
  .event { background: var(--panel); border-radius: 8px; padding: 8px 12px; border-left: 4px solid var(--line); }
  .event.alert { border-left-color: var(--alert); }
  .event.done { border-left-color: var(--accent); }
  .event.analyzing { border-left-color: var(--warn); }
  .event .meta { color: var(--muted); font-size: 12px; margin-bottom: 2px; }
  .event .badge { font-weight: 700; margin-right: 8px; }
  .event.alert .badge { color: var(--alert); }

  .toggles { color: var(--muted); user-select: none; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 4px 0 10px; vertical-align: middle; }
  @media (max-width: 800px) { .stats { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<main id="app"></main>

<script type="module">
  import { mountCamera, follow, renderEvents } from "./camera.js";

  const params = new URLSearchParams(location.search);
  const url = params.get("url") ?? "http://localhost:4443";
  const cams = (params.get("cams") ?? "driveway,night,warehouse,street").split(",");
  const selected = params.get("name") ?? cams[0];
  const host = location.hostname.includes(":") ? `[${location.hostname}]` : location.hostname;
  const askUrl = `http://${host}:8078/ask`;
  const app = document.getElementById("app");
  const $ = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  const pct = (x) => `${Math.max(0, Math.round(x))}%`;
  const link = (name) => `?${new URLSearchParams({ ...Object.fromEntries(params), name })}`;

  app.append($(`<header><h1><a href="?">Codec Vision</a></h1>
    <span class="sub">AI on security cameras only when someone is watching, and only when the camera's own encoder sees motion</span></header>`));
  app.append($(`<div class="stats">
    <div class="stat win"><b id="saved">-</b><span>GPU detector time saved vs every frame, all cameras</span></div>
    <div class="stat"><b id="ms">-</b><span>detector time used / every-frame</span></div>
    <div class="stat"><b id="frames">-</b><span>frames sent to the detector</span></div>
    <div class="stat"><b id="described">0 · 0</b><span>events described by Cosmos · alerts</span></div></div>`));

  // One tab per camera: its savings, whether its AI runs live (someone watching) or in the background.
  const tabs = $(`<nav class="tabs"></nav>`);
  app.append(tabs);
  const state = {};
  for (const name of cams) {
    const tab = $(`<a class="tab"><div class="row"><span class="name"></span><span class="saved">-</span></div><span class="ai">AI: waiting</span></a>`);
    tab.href = link(name);
    tab.querySelector(".name").textContent = name;
    if (name === selected) tab.classList.add("on");
    tabs.append(tab);
    state[name] = { tab, stats: undefined, events: [] };
    follow(url, `${name}-ai`, "stats", (text) => { state[name].stats = JSON.parse(text); }, 2).catch(console.error);
    follow(url, `${name}-ai`, "events", (text) => {
      state[name].events = JSON.parse(text).filter((e) => e.state !== "quiet");
      flagAlerts(name);
      renderAll();
    }, 1).catch(console.error);
  }

  const stage = $(`<div></div>`);
  app.append(stage);
  const cam = mountCamera(stage, { url, name: selected });
  const banner = $(`<div class="banner"></div>`);
  stage.append(banner);

  const toggles = $(`<div class="toggles">
    <label><input type="checkbox" id="ai" checked> <b>AI on</b> (subscribes to detections; off stops the models)</label>
    <label><input type="checkbox" data-k="motion" checked> codec motion</label>
    <label><input type="checkbox" data-k="regions" checked> detector regions</label>
    <label><input type="checkbox" data-k="boxes" checked> detections</label>
    <span class="legend"><i style="background:#ff3b5c"></i>re-detected<i style="background:#5ac85a"></i>cached<i style="background:#ffc800"></i>moved by vectors<i style="background:#00e5ff"></i>region</span></div>`);
  toggles.querySelectorAll("input[data-k]").forEach((i) => (i.onchange = () => (cam.show[i.dataset.k] = i.checked)));
  toggles.querySelector("#ai").onchange = (e) => cam.setAI(e.target.checked);

  const ask = $(`<form class="ask"><input id="q" placeholder="Ask the cameras: did anyone walk by? which camera saw a truck?" autocomplete="off"><button>Ask</button></form>`);
  const answer = $(`<div class="answer"></div>`);
  ask.onsubmit = async (e) => {
    e.preventDefault();
    const q = ask.querySelector("#q").value.trim();
    if (!q) return;
    answer.className = "answer on";
    answer.textContent = "Thinking...";
    try {
      const res = await fetch(`${askUrl}?q=${encodeURIComponent(q)}`).then((r) => r.json());
      answer.textContent = res.answer ?? `Error: ${res.error}`;
    } catch (err) {
      answer.textContent = `Ask service unreachable (${err.message})`;
    }
  };

  const feed = $(`<div class="events"></div>`);
  app.append(toggles, ask, answer, $(`<h2>Events <small>all cameras, described by NVIDIA Cosmos only when an object moved</small></h2>`), feed);
  renderEvents(feed, []);

  const seen = new Map(); // "cam/id" -> when this page first saw the event
  const alerted = new Set();
  let first = true;
  setTimeout(() => (first = false), 3000); // don't replay old alerts as new on page load

  function flagAlerts(name) {
    const s = state[name];
    for (const e of s.events) {
      const key = `${name}/${e.id}`;
      if (!seen.has(key)) seen.set(key, Date.now());
      if (e.state !== "alert" || alerted.has(key)) continue;
      alerted.add(key);
      if (first) continue;
      s.tab.classList.add("alerting");
      setTimeout(() => s.tab.classList.remove("alerting"), 6000);
      if (name === selected) {
        banner.textContent = `ALERT · ${e.summary}`;
        banner.classList.add("on");
        clearTimeout(banner.timer);
        banner.timer = setTimeout(() => banner.classList.remove("on"), 8000);
      }
    }
  }

  function renderAll() {
    const all = cams.flatMap((name) => state[name].events.map((e) => ({ ...e, cam: name, at: seen.get(`${name}/${e.id}`) ?? 0 })));
    all.sort((a, b) => b.at - a.at || b.id - a.id);
    const recent = all.slice(0, 12);
    if (!recent.length) return renderEvents(feed, []);
    feed.replaceChildren();
    for (const e of recent) {
      const box = document.createElement("div");
      renderEvents(box, [e], { camera: e.cam });
      feed.append(box.firstElementChild);
    }
  }

  function tick() {
    let ms = 0, every = 0, frames = 0, inferred = 0, described = 0;
    for (const name of cams) {
      const { tab, stats: s, events } = state[name];
      described += events.filter((e) => e.state === "done" || e.state === "alert").length;
      const ai = tab.querySelector(".ai");
      ai.textContent = s?.watched ? "AI: running (watched)" : "AI: off (nobody watching)";
      ai.classList.toggle("live", !!s?.watched);
      if (!s?.full_ms) continue;
      const e = s.frames * s.full_ms;
      ms += s.ms; every += e; frames += s.frames; inferred += s.inferred;
      tab.querySelector(".saved").textContent = `${pct(100 * (1 - s.ms / e))} saved`;
    }
    if (every) {
      document.getElementById("saved").textContent = pct(100 * (1 - ms / every));
      document.getElementById("ms").textContent = `${(ms / 1000).toFixed(1)}s / ${(every / 1000).toFixed(1)}s`;
      document.getElementById("frames").textContent = pct(100 * inferred / frames);
    }
    document.getElementById("described").textContent = `${described} · ${alerted.size}`;
  }
  setInterval(tick, 500);
</script>
</body>
</html>
